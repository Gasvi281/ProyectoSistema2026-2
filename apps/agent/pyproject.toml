[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proptech-agent"
version = "0.1.0"
description = "Conversational property assistant (E6)"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=0.0.10",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-dir]
"" = "src"
